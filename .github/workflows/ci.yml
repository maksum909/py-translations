name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            django: "4.2.*"
          - python: "3.12"
            django: "4.2.*"
          - python: "3.10"
            django: "5.2.*"
          - python: "3.12"
            django: "5.2.*"
          - python: "3.13"
            django: "5.2.*"
          - python: "3.12"
            django: "6.0.*"
          - python: "3.13"
            django: "6.0.*"
          - python: "3.12"
            django: "6.1.*"
          - python: "3.13"
            django: "6.1.*"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Django==${{ matrix.django }}" pytest pytest-django "djangorestframework>=3.15"
      - name: Test
        run: pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Django==5.2.*" pytest pytest-django ruff mypy django-stubs "djangorestframework>=3.15"
      - name: Ruff
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Mypy
        run: mypy src/py_translations
