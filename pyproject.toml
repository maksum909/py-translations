[project]
name = "py-translations"
version = "0.1.0"
description = "Typed translations for Django model fields. JSON column by default, a translation table when you need indexes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["django>=4.2"]

[project.optional-dependencies]
drf = ["djangorestframework>=3.15"]
dev = [
    "pytest>=8",
    "pytest-django>=4.8",
    "ruff>=0.8",
    "mypy>=1.13",
    "django-stubs>=5.1",
    "djangorestframework>=3.15",
]
benchmark = ["django-parler>=2.3"]

[project.urls]
Homepage = "https://github.com/maksum909/py-translations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_translations"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["py_translations", "tests"]

[tool.mypy]
python_version = "3.10"
mypy_path = ["src", "."]
packages = ["py_translations"]
plugins = ["mypy_django_plugin.main"]
warn_unused_ignores = false
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "tests.settings"
